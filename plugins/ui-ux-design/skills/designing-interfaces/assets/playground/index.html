<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>UI Playground</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Google Fonts (https://fonts.google.com) and Material Symbols (https://fonts.google.com/icons) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Roboto+Mono:wght@400..700&family=Source+Serif+4:wght@400..700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        const q = new URLSearchParams(location.search);
        const s = JSON.parse(localStorage.getItem("playground-settings") || "{}");
        const theme = q.get("theme") || s.theme || "system";
        const dark = theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
